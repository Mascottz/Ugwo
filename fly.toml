app = "ugwo-ledger"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  UGWO_DB_PATH = "/data/ugwo.db"
  UGWO_KERNEL_BIN = "/app/priv/bin/ugwo-kernel"
  UGWO_STATIC_DIR = "/app/priv/static"

[mounts]
  source = "ugwo_wal_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "4s"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
